[project]
name = "atlasoil-backend"
version = "0.1.0"
description = "API do painel AtlasOil: cotações, notícias e chat."
requires-python = ">=3.11,<4"
dependencies = [
    "openai>=1.0,<2",
    "fastapi>=0.162,<1",
    "httpx2>=2.13,<3",
    "pydantic-settings>=2.16,<3",
    "uvicorn[standard]>=0.54,<1",
]

[dependency-groups]
dev = ["pytest>=8,<10"]

[tool.poetry]
package-mode = false
requires-poetry = ">=2.2"
