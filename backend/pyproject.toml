[project]
name = "barril-backend"
version = "0.1.0"
description = "API do painel Barril: cotações, notícias e chat."
requires-python = ">=3.11,<4"
dependencies = [
    "openai>=1.0,<2",
    "fastapi>=0.162,<1",
    "httpx2>=2.13,<3",
    "pydantic-settings>=2.16,<3",
    "uvicorn[standard]>=0.54,<1",
    "sqlalchemy[asyncio]>=2.0,<3",
    "asyncpg>=0.30,<1",
]

[dependency-groups]
dev = [
    "pytest>=8,<10",
    "pytest-asyncio>=0.24,<1",
    "aiosqlite>=0.20,<1",
]

[tool.poetry]
package-mode = false
requires-poetry = ">=2.2"
