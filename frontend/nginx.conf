server {
    listen 80;
    root /usr/share/nginx/html;

    # DNS interno do Docker. Resolver o nome a cada pedido deixa o backend
    # reiniciar sem que o frontend precise reiniciar junto.
    resolver 127.0.0.11 valid=10s;
    resolver_timeout 3s;

    location / {
        try_files $uri /index.html;
    }

    location /api/ {
        set $backend http://backend:8000;
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;

        # O chat responde em streaming.
        proxy_buffering off;
        proxy_read_timeout 120s;
    }
}
